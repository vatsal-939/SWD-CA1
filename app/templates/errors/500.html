{% extends "base.html" %}
{% block title %}500 - Internal Server Error{% endblock %}
{% block content %}
<div class="row justify-content-center text-center py-5">
    <div class="col-md-6">
        <h1 class="display-3 text-secondary">500</h1>
        <h3 class="mb-3">Internal Server Error</h3>
        <p class="text-muted">An unexpected server condition occurred. For security reasons, detailed system diagnostics and stack traces are suppressed.</p>
        <a href="{{ url_for('index') }}" class="btn btn-primary mt-2">Return to Safety</a>
    </div>
</div>
{% endblock %}
