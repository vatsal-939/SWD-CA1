{% extends "base.html" %}
{% block title %}400 - Bad Request{% endblock %}
{% block content %}
<div class="row justify-content-center text-center py-5">
    <div class="col-md-6">
        <h1 class="display-3 text-warning">400</h1>
        <h3 class="mb-3">Bad Request</h3>
        <p class="text-muted">The server could not understand the request due to invalid syntax or corrupted headers.</p>
        <a href="{{ url_for('index') }}" class="btn btn-primary mt-2">Return to Safety</a>
    </div>
</div>
{% endblock %}
