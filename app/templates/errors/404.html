{% extends "base.html" %}
{% block title %}404 - Not Found{% endblock %}
{% block content %}
<div class="row justify-content-center text-center py-5">
    <div class="col-md-6">
        <h1 class="display-3 text-muted">404</h1>
        <h3 class="mb-3">Page Not Found</h3>
        <p class="text-muted">The resource or page you requested could not be found on this server.</p>
        <a href="{{ url_for('index') }}" class="btn btn-primary mt-2">Return Home</a>
    </div>
</div>
{% endblock %}
