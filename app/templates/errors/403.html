{% extends "base.html" %}
{% block title %}403 - Forbidden{% endblock %}
{% block content %}
<div class="row justify-content-center text-center py-5">
    <div class="col-md-6">
        <h1 class="display-3 text-danger">403</h1>
        <h3 class="mb-3">Access Denied</h3>
        <p class="text-muted">You do not have the required role or ownership permissions to access this resource. This event has been logged for security audit purposes.</p>
        <a href="{{ url_for('index') }}" class="btn btn-outline-danger mt-2">Return to Dashboard</a>
    </div>
</div>
{% endblock %}
