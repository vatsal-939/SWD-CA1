{% extends "base.html" %}
{% block title %}Create Medical Record - MedVault{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card p-4 bg-white">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h3 class="card-title mb-0">New Clinical Record</h3>
                <a href="{{ url_for('records.list_records') }}" class="btn btn-outline-secondary btn-sm">&larr; Cancel</a>
            </div>
            <p class="text-muted small mb-4">Enter diagnosis and clinical management notes for patient file.</p>

            <form method="POST" action="{{ url_for('records.create_record') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="patient_id" class="form-label">Patient</label>
                        <select class="form-select" id="patient_id" name="patient_id" required>
                            <option value="">-- Select Patient --</option>
                            {% for p in patients %}
                                <option value="{{ p.id }}">{{ p.full_name }} ({{ p.email }})</option>
                            {% endfor %}
                        </select>
                    </div>

                    {% if session.get('role') == 'admin' %}
                        <div class="col-md-6">
                            <label for="doctor_id" class="form-label">Attending Doctor</label>
                            <select class="form-select" id="doctor_id" name="doctor_id" required>
                                {% for d in doctors %}
                                    <option value="{{ d.id }}">{{ d.full_name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    {% endif %}
                </div>

                <div class="mb-3">
                    <label for="diagnosis" class="form-label">Primary Diagnosis</label>
                    <input type="text" class="form-control" id="diagnosis" name="diagnosis" required placeholder="e.g. Type 2 Diabetes Mellitus">
                </div>

                <div class="mb-3">
                    <label for="treatment_notes" class="form-label">Consultation &amp; Clinical Notes</label>
                    <textarea class="form-control" id="treatment_notes" name="treatment_notes" rows="4" required placeholder="Observations, vitals, examination findings, dietary recommendations..."></textarea>
                </div>

                <div class="mb-3">
                    <label for="prescription" class="form-label">Prescription &amp; Medication Schedule</label>
                    <textarea class="form-control" id="prescription" name="prescription" rows="3" required placeholder="e.g. Metformin 500mg twice daily with meals."></textarea>
                </div>

                <div class="d-flex justify-content-end gap-2 mt-4">
                    <a href="{{ url_for('records.list_records') }}" class="btn btn-outline-secondary">Cancel</a>
                    <button type="submit" class="btn btn-primary">Save Medical Record</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
