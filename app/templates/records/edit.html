{% extends "base.html" %}
{% block title %}Edit Record #{{ record.id }} - MedVault{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card p-4 bg-white">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h3 class="card-title mb-0">Edit Record #{{ record.id }}</h3>
                <a href="{{ url_for('records.view_record', record_id=record.id) }}" class="btn btn-outline-secondary btn-sm">&larr; Cancel</a>
            </div>
            <p class="text-muted small mb-4">Patient: <strong>{{ record.patient_name }}</strong> | Attending Doctor: <strong>{{ record.doctor_name }}</strong></p>

            <form method="POST" action="{{ url_for('records.edit_record', record_id=record.id) }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="mb-3">
                    <label for="diagnosis" class="form-label">Diagnosis</label>
                    <input type="text" class="form-control" id="diagnosis" name="diagnosis" value="{{ record.diagnosis }}" required>
                </div>

                <div class="mb-3">
                    <label for="treatment_notes" class="form-label">Treatment Notes</label>
                    <textarea class="form-control" id="treatment_notes" name="treatment_notes" rows="4" required>{{ record.treatment_notes }}</textarea>
                </div>

                <div class="mb-3">
                    <label for="prescription" class="form-label">Prescription</label>
                    <textarea class="form-control" id="prescription" name="prescription" rows="3" required>{{ record.prescription }}</textarea>
                </div>

                <div class="d-flex justify-content-end gap-2 mt-4">
                    <a href="{{ url_for('records.view_record', record_id=record.id) }}" class="btn btn-outline-secondary">Cancel</a>
                    <button type="submit" class="btn btn-primary">Update Record</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
